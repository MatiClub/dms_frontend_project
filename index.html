:root{
  color-scheme:light;
  --stage:#E6E9EF;
  --panel:#F4F5F8;
  --ink:#14161B;
  --ink2:#3A3E48;
  --muted:#626774;
  --line:#D3D7DF;
  --accent:#2F5BD3;
  --accent-soft:#DCE5FB;
  --bezel:#08090B;
  --pill:#14161B;
  --pill-ink:#F4F5F8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --stage:#0E0F12;
    --panel:#15161A;
    --ink:#EDEDEF;
    --ink2:#C9C9D0;
    --muted:#8E8E98;
    --line:#26272C;
    --accent:#7FA4FF;
    --accent-soft:#1A2744;
    --bezel:#000000;
    --pill:#EDEDEF;
    --pill-ink:#0E0F12;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--stage);color:var(--ink);
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:288px minmax(0,1fr) 360px;}
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.brand{padding:28px 24px 18px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
.brand p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:6px 12px 12px;overflow-y:auto;flex:1;min-height:0}
.steps li{margin:0}
.step{
  width:100%;border:0;background:transparent;text-align:left;
  display:grid;grid-template-columns:28px 1fr;gap:2px 10px;align-items:baseline;
  padding:9px 12px;border-radius:12px;
}
.step:hover{background:var(--accent-soft)}
.step .n{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);font-weight:500;text-align:right}
.step .t{font-size:15px;font-weight:500;line-height:1.3}
.step .r{grid-column:2;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.step[aria-current="step"]{background:var(--ink);color:var(--stage)}
.step[aria-current="step"] .n,.step[aria-current="step"] .r{color:var(--stage);opacity:.7}
.keys{padding:14px 24px 22px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.7}
kbd{font-family:inherit;font-size:12px;font-weight:600;display:inline-block;min-width:22px;text-align:center;padding:0 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;color:var(--ink2);background:var(--stage)}

.stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.phone-box{position:relative;flex:none}
.phone{
  position:absolute;left:0;top:0;width:414px;height:868px;
  transform-origin:0 0;
  border-radius:54px;background:var(--bezel);padding:12px;
  box-shadow:0 0 0 1px rgba(127,127,140,.28),0 30px 80px -20px rgba(10,14,30,.45);
}
.screen{position:relative;width:390px;height:844px;border-radius:42px;overflow:hidden;background:#0B0B0C}
.screen iframe{position:absolute;inset:0;width:390px;height:844px;border:0;display:block;background:transparent;opacity:0;transition:opacity .18s ease}
.screen iframe.on{opacity:1}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7C7C84;font-size:14px}

.notes{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.notes-body{flex:1;min-height:0;overflow-y:auto;padding:30px 28px 20px}
.req{font-size:56px;line-height:1;font-weight:600;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;margin:0}
.req.many{font-size:40px}
.req.none{font-size:30px;letter-spacing:-0.02em}
.req-name{margin:10px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.notes h2{margin:26px 0 8px;font-size:24px;font-weight:600;letter-spacing:-0.015em;line-height:1.2}
.desc{margin:0;color:var(--ink2);font-size:15.5px;line-height:1.6;max-width:36em}
.notes h3{margin:26px 0 10px;font-size:14px;font-weight:600;color:var(--ink)}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tips li{position:relative;padding-left:18px;font-size:14.5px;color:var(--ink2);line-height:1.5}
.tips li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.ctrl{margin-top:26px;display:flex;flex-direction:column;gap:8px}
.ctrl[hidden]{display:none}
.ctrl label{font-size:14px;font-weight:600}
.seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--stage)}
.seg button{flex:1;border:0;border-radius:9px;background:transparent;padding:7px 8px;font-size:14px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--stage)}
.pager{border-top:1px solid var(--line);padding:16px 20px 20px;display:flex;align-items:center;gap:10px}
.pager .count{flex:1;text-align:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--stage);font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

.mini{
  position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:none;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--pill);color:var(--pill-ink);
  box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:5
}
.mini button{width:40px;height:40px;border:0;border-radius:20px;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center}
.mini span{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 6px;min-width:110px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}

body.clean .app{grid-template-columns:minmax(0,1fr)}
body.clean .rail,body.clean .notes{display:none}
body.clean .mini{display:flex}
body.clean .stage{padding-bottom:70px}

@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr) 340px}
  .rail{display:none}
}
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr)}

<script type="application/json" id="demo-shell">"\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003ctitle>Repozytorium – przeglądanie\u003c/title>\n  \u003cstyle>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }\n    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }\n    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }\n    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }\n    #__bundler_placeholder { color: #999; font-size: 14px; }\n  \u003c/style>\n  \u003cnoscript>\n    \u003cstyle>#__bundler_loading { display: none; }\u003c/style>\n    \u003cdiv style=\"position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;\">\n      This page requires JavaScript to display.\n    \u003c/div>\n  \u003c/noscript>\n\u003c/head>\n\u003cbody>\n  \u003cdiv id=\"__bundler_placeholder\">Loading Repozytorium – przeglądanie...\u003c/div>\n  \u003cdiv id=\"__bundler_loading\">Unpacking...\u003c/div>\n\n  \u003cscript>\n    \ndocument.addEventListener('DOMContentLoaded', async function() {\n  const loading = document.getElementById('__bundler_loading');\n  function setStatus(msg) { if (loading) loading.textContent = msg; }\n\n  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\\.ms-fontobject)/i;\n  const MIME_TOKEN = /^[\\w.+-]+[/][\\w.+-]+$/;\n  function toBase64(bytes) {\n    let bin = '';\n    for (let i = 0; i \u003c bytes.length; i += 0x8000) {\n      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));\n    }\n    return btoa(bin);\n  }\n\n  // Error sink persists across replaceWith since it's on window, not the DOM.\n  window.addEventListener('error', function(e) {\n    // Failed resource loads (CSP-blocked links, scripts, images) fire plain\n    // events at the element — warn only; real JS errors carry message/error.\n    if (!e.message && !e.error && e.target && e.target !== window) {\n      console.warn('[bundle] resource failed to load:',\n        e.target.tagName, String(e.target.src || e.target.href || ''));\n      return;\n    }\n    var p = document.body || document.documentElement;\n    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));\n    d.id = '__bundler_err';\n    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';\n    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +\n      '[bundle] ' + (e.message || e.type) +\n      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');\n  }, true);\n\n  try {\n    const manifestEl = document.querySelector('script[type=\"__bundler/manifest\"]');\n    const templateEl = document.querySelector('script[type=\"__bundler/template\"]');\n    if (!manifestEl || !templateEl) {\n      setStatus('Error: missing bundle data');\n      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);\n      return;\n    }\n\n    const manifest = JSON.parse(manifestEl.textContent);\n    let template = JSON.parse(templateEl.textContent);\n\n    // Nested page bundles (iframe targets) }-[0-9a-f]{12}$/;\n    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames\n    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down\n    function mountPage(el, frag, text) {\n      const pageBlob = new Blob([text], { type: 'text/html' });\n      const u = URL.createObjectURL(pageBlob);\n      resourceBlobs[u] = pageBlob;\n      el.src = u + frag;\n    }\n    function deliverPage(uuid, text) {\n      const frames = pendingFrames[uuid];\n      delete pendingFrames[uuid];\n      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);\n      const relays = pendingRelays[uuid];\n      delete pendingRelays[uuid];\n      if (relays) {\n        for (const cw of relays) {\n          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }\n        }\n      }\n    }\n    function ownFrameWindows() {\n      const out = [];\n      for (const f of Array.from(document.querySelectorAll('iframe'))) {\n        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }\n      }\n      return out;\n    }\n    window.addEventListener('message', function (e) {\n      const d = e.data;\n      if (!d || typeof d !== 'object' || !e.source) return;\n      // Origin gate first; the structural checks below (own-child-frames\n      // for requests, direct-parent + solicited-uuid for replies, the\n      // root's never-relay rule) are what hold in fully opaque chains\n      // where origin strings can't discriminate — a sandboxed root's\n      // FOREIGN wrapper still fails all three even though both serialize\n      // as real-vs-'null' rather than matching.\n      if (!trustedOrigin(e)) return;\n      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {\n        // Requests are honored only for this document's own child frames.\n        if (ownFrameWindows().indexOf(e.source) \u003c 0) return;\n        const uuid = d.__bundler_need;\n        const text = pageTexts[uuid];\n        if (typeof text === 'string') {\n          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }\n          return;\n        }\n        if (isPageRoot || window.parent === window) return; // authoritative miss\n        const waiting = pendingRelays[uuid];\n        if (waiting) {\n          if (waiting.indexOf(e.source) \u003c 0) waiting.push(e.source);\n          return;\n        }\n        // Never-answered uuids would otherwise accumulate forever under a\n        // request spray; past the cap (far above any real page count) new\n        // relays are dropped rather than remembered.\n        if (Object.keys(pendingRelays).length >= 128) return;\n        pendingRelays[uuid] = [e.source];\n        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);\n      } else if (\n        typeof d.__bundler_page === 'string' &&\n        UUID_SHAPE.test(d.__bundler_page) &&\n        typeof d.__bundler_text === 'string'\n      ) {\n        // The shape test is load-bearing beyond tidiness: the solicited\n        // check below uses the in operator, which matches prototype keys\n        // ('__proto__', 'constructor') — an unshaped key would reach\n        // deliverPage and throw, painting the error banner.\n        // Text is accepted only from the direct parent — the document\n        // that minted this one.\n        if (e.source !== window.parent || window.parent === window) return;\n        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;\n        deliverPage(d.__bundler_page, d.__bundler_text);\n      }\n    });\n\n    const uuids = Object.keys(manifest);\n    setStatus('Unpacking ' + uuids.length + ' assets...');\n\n    await Promise.all(uuids.map(async (uuid) => {\n      const entry = manifest[uuid];\n      try {\n        const binaryStr = atob(entry.data);\n        const bytes = new Uint8Array(binaryStr.length);\n        for (let i = 0; i \u003c binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);\n\n        let finalBytes = bytes;\n        if (entry.compressed) {\n          if (typeof DecompressionStream !== 'undefined') {\n            const ds = new DecompressionStream('gzip');\n            const writer = ds.writable.getWriter();\n            const reader = ds.readable.getReader();\n            writer.write(bytes);\n            writer.close();\n            const chunks = [];\n            let totalLen = 0;\n            while (true) {\n              const { done, value } = await reader.read();\n              if (done) break;\n              chunks.push(value);\n              totalLen += value.length;\n            }\n            finalBytes = new Uint8Array(totalLen);\n            let offset = 0;\n            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }\n          } else {\n            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');\n          }\n        }\n\n        if (pageSet.has(uuid)) {\n          pageTexts[uuid] = new TextDecoder().decode(finalBytes);\n          return;\n        }\n        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {\n          // Strict artifact hosts allow font-src data: but not blob:.\n          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +\n            (entry.compressed ? toBase64(finalBytes) : entry.data);\n        } else {\n          const blob = new Blob([finalBytes], { type: entry.mime });\n          blobUrls[uuid] = URL.createObjectURL(blob);\n          resourceBlobs[blobUrls[uuid]] = blob;\n        }\n      } catch (err) {\n        console.error('Failed to decode asset ' + uuid + ':', err);\n        const blob = new Blob([], { type: entry.mime });\n        blobUrls[uuid] = URL.createObjectURL(blob);\n        resourceBlobs[blobUrls[uuid]] = blob;\n      }\n    }));\n\n    const extResEl = document.querySelector('script[type=\"__bundler/ext_resources\"]');\n    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];\n    const resourceMap = {};\n    for (const entry of extResources) {\n      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];\n    }\n\n    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —\n    // consumers read these Blobs directly. Survives the swap like the error sink.\n    window.__resourceBlobs = resourceBlobs;\n\n    setStatus('Rendering...');\n    // Page uuids have no blob here — they ride inside about:blank#\u003cuuid>\n    // frame markers the pass below resolves after the swap.\n    for (const uuid of uuids) {\n      if (pageSet.has(uuid)) continue;\n      template = template.split(uuid).join(blobUrls[uuid]);\n    }\n\n    // Strip integrity + crossorigin — blob URLs from a file:// document inherit\n    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.\n    // The manifest bytes are ours; SRI protects against CDN compromise, not this.\n    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the\n    // bundler left live-fetched (an absolute x-import, a runtime dependency it\n    // could not embed, an authored external script) keeps the pin it was\n    // written with: that fetch is exactly what SRI protects. (A crossorigin\n    // on a parent whose child carries the blob — \u003cvideo crossorigin>\u003csource>\n    // — is left alone too; the attribute is then the author's to drop.)\n    template = template.replace(/\u003c[a-z][^>]*>/gi, (tag) => /\\s(?:src|href|srcset|poster|data|xlink:href)=\"blob:/i.test(tag) ? tag.replace(/\\s+integrity=\"[^\"]*\"/gi, '').replace(/\\s+crossorigin=\"[^\"]*\"/gi, '') : tag);\n\n    const resourceScript = '\u003cscript>window.__resources = ' +\n      JSON.stringify(resourceMap).replace(/\u003c\\//g, '\u003c\\\\/') +\n      ';\u003c/' + 'script>';\n    // Inject after \u003chead> so the DOCTYPE stays first; prepending yle=\"display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{r.fg}}\">{{r.mark}} {{r.label}}\u003c/li>\n\u003c/sc-for>\n\u003c/ul>\n\u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\n\u003clabel for=\"f-pass2\" style=\"font-size: 14px; font-weight: 500; color: var(--muted2)\">Powtórz nowe hasło\u003c/label>\n\u003cinput id=\"f-pass2\" type=\"password\" autocomplete=\"new-password\" value=\"{{draftNew2}}\" sc-camel-on-change=\"{{setDraftNew2}}\" style=\"height: 50px; border-radius: 12px; border: 1px solid {{pass2Border}}; background: var(--surface); color: var(--text); padding: 0 14px; font-size: 16px; box-sizing: border-box; width: 100%\">\n\u003c/div>\n\u003csc-if value=\"{{mismatch}}\" hint-placeholder-val=\"{{ false }}\">\u003cspan style=\"font-size: 13px; color: var(--danger)\">Hasła się różnią.\u003c/span>\u003c/sc-if>\n\u003c/sc-if>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px\">\n\u003cbutton sc-camel-on-click=\"{{closeEdit}}\" style=\"height: 52px; border-radius: 14px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 15px; font-weight: 600\">Anuluj\u003c/button>\n\u003cbutton sc-camel-on-click=\"{{saveEdit}}\" disabled=\"{{cannotSave}}\" style=\"height: 52px; border-radius: 14px; border: none; background: {{saveBg}}; color: {{saveFg}}; font-size: 15px; font-weight: 600\">Zapisz\u003c/button>\n\u003c/div>\n\u003c/section>\n\u003c/div>\n\u003c/sc-if>\n\n\u003csc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv role=\"status\" style=\"position: absolute; left: 16px; right: 16px; bottom: 28px; z-index: 25; background: var(--text); color: var(--bg); border-radius: 14px; padding: 14px 16px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.5)\">{{toast}}\u003c/div>\n\u003c/sc-if>\n\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;auto&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5B8CFF&quot;,&quot;options&quot;:[&quot;#5B8CFF&quot;,&quot;#3DDC97&quot;,&quot;#F2A65A&quot;,&quot;#EDEDEF&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const read = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };\n    this.state = { username: 'jkowalski', email: 'jan.kowalski@firma.pl', edit: null, draftName: '', draftEmail: '', draftOld: '', draftNew: '', draftNew2: '', toast: null, theme: read('repo-theme', 'dark'), nameMode: read('repo-name-mode', 'title'), dateMode: read('repo-date-mode', 'abs') };\n  }\n  componentWillUnmount() { clearTimeout(this.tt); }\n  renderVals() {\n    const accent = this.props.accent ?? '#5B8CFF';\n    const s = this.state;\n    const save = (k, v, patch) => { try { localStorage.setItem(k, v); } catch (e) {} this.setState(patch); };\n    const prefersLight = (() => { try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); } catch (e) { return false; } })();\n    const forced = (this.props.theme && this.props.theme !== 'auto') ? this.props.theme : null;\n    const resolved = forced || (s.theme === 'auto' ? (prefersLight ? 'light' : 'dark') : s.theme);\n    const emailOk = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test((s.draftEmail || '').trim());\n    const emailBad = (s.draftEmail || '').trim().length > 3 && !emailOk;\n    const pwRules = [\n      { label: '8 znaków', ok: (s.draftNew || '').length >= 8 },\n      { label: 'wielka litera', ok: /[A-ZĄĆĘŁŃÓŚŹŻ]/.test(s.draftNew || '') },\n      { label: 'cyfra', ok: /\\d/.test(s.draftNew || '') }\n    ];\n    const mismatch = (s.draftNew2 || '').length > 0 && s.draftNew2 !== s.draftNew;\n    const canSave = s.edit === 'name' ? (s.draftName || '').trim().length >= 3 && (s.draftName || '').trim() !== s.username\n      : s.edit === 'email' ? emailOk && (s.draftEmail || '').trim() !== s.email\n      : s.edit === 'password' ? (s.draftOld || '').length > 0 && pwRules.every((r) => r.ok) && s.draftNew === s.draftNew2\n      : false;\n    const opt = (cur, id) => ({ on: cur === id, bg: cur === id ? 'var(--seg)' : 'transparent', fg: cur === id ? 'var(--text)' : 'var(--muted)', subFg: cur === id ? 'var(--muted2)' : 'var(--placeholder)' });\n    return {\n      accent,\n      themeClass: resolved === 'light' ? 't-light' : 't-dark',\n      themeHint: s.theme === 'auto' ? 'Dopasowuje się do ustawień telefonu.' : (s.theme === 'light' ? 'Zawsze jasny wygląd.' : 'Zawsze ciemny wygląd.'),\n      themes: [['light', 'Jasny'], ['dark', 'Ciemny'], ['auto', 'Automatyczny']].map(([id, label]) => Object.assign(opt(s.theme, id), {\n        label, isLight: id === 'light', isDark: id === 'dark', isAuto: id === 'auto',\n        pick: () => save('repo-theme', id, { theme: id })\n      })),\n      nameModes: [['title', 'Tytuł', 'Umowa najmu biura', \"'Outfit', system-ui, sans-serif\"], ['file', 'Nazwa pliku', 'Umowa_najmu.pdf', \"'IBM Plex Mono', ui-monospace, monospace\"]].map(([id, label, sub, font]) => Object.assign(opt(s.nameMode, id), {\n        label, sub, subFont: font, pick: () => save('repo-name-mode', id, { nameMode: id })\n      })),\n      dateModes: [['abs', 'Data', '08.10.2026'], ['rel', 'Względna', '2 dni temu']].map(([id, label, sub]) => Object.assign(opt(s.dateMode, id), {\n        label, sub, pick: () => save('repo-date-mode', id, { dateMode: id })\n      })),\n      username: s.username,\n      email: s.email,\n      initials: s.username.slice(0, 2).toUpperCase(),\n      passwordMask: '••••••••',\n      editName: () => this.setState({ edit: 'name', draftName: s.username }),\n      editEmail: () => this.setState({ edit: 'email', draftEmail: '' }),\n      editPassword: () => this.setState({ edit: 'password', draftOld: '', draftNew: '', draftNew2: '' }),\n      closeEdit: () => this.setState({ edit: null }),\n      editing: !!s.edit,\n      isName: s.edit === 'name', isEmail: s.edit === 'email', isPassword: s.edit === 'password',\n      editTitle: { name: 'Zmień nazwę użytkownika', email: 'Zmień e-mail', password: 'Zmień hasło' }[s.edit] || '',\n      draftName: s.draftName, setDraftName: (e) => this.setState({ draftName: e.target.value }),\n      draftEmail: s.draftEmail, setDraftEmail: (e) => this.setState({ draftEmail: e.target.value }),\n      draftOld: s.draftOld, setDraftOld: (e) => this.setState({ draftOld: e.target.value }),\n      draftNew: s.draftNew, setDraftNew: (e) => this.setState({ draftNew: e.target.value }),\n      draftNew2: s.draftNew2, setDraftNew2: (e) => this.setState({ draftNew2: e.target.value }),\n      emailBad: emailBad, emailBorder: emailBad ? 'var(--err-border)' : 'var(--border)',\n      rules: pwRules.map((r) => ({ label: r.label, mark: r.ok ? '✓' : '•', fg: r.ok ? 'var(--soft-text)' : 'var(--muted)' })),\n      mismatch: mismatch, pass2Border: mismatch ? 'var(--err-border)' : 'var(--border)',\n      cannotSave: !canSave,\n      saveBg: canSave ? accent : 'var(--line)', saveFg: canSave ? '#0B0B0C' : 'var(--placeholder)',\n      saveEdit: () => {\n        if (!canSave) return;\n        clearTimeout(this.tt);\n        this.tt = setTimeout(() => this.setState({ toast: null }), 3000);\n        if (s.edit === 'name') this.setState({ username: s.draftName.trim(), edit: null, toast: 'Zapisano nazwę użytkownika' });\n        else if (s.edit === 'email') this.setState({ edit: null, toast: 'Wysłano link potwierdzający na ' + s.draftEmail.trim() });\n        else this.setState({ edit: null, toast: 'Hasło zostało zmienione' });\n      },\n      hasToast: !!s.toast,\n      toast: s.toast || '',\n      previewName: s.nameMode === 'title' ? 'Umowa najmu biura 2026' : 'Umowa_najmu_2026.pdf',\n      previewMeta: '2,4 MB · ' + (s.dateMode === 'rel' ? '2 dni temu' : '08.10.2026')\n    };\n  }\n}\n\u003c/script>\n\n\n\u003c/body>\u003c/html>", "Udostepnione": "\u003c!DOCTYPE html>\n\u003chtml lang=\"pl\">\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Repozytorium – udostępnione\u003c/title>\n\u003cscript src=\"fc6a4292-bf8b-48ae-8ba2-1b27308225da\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"608d655f-ac7e-44ed-877f-a3002d93e6f8\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2df5a488-4d2e-4c79-a4f3-7914ec534bc3\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"76bc42b3-0ecd-475b-b61d-c6a92425779a\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"bfa4d876-4d8e-4240-95d5-5c33e8750b92\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d9d62d73-8dae-4f52-a8b8-dd3 ll.length)],\n      isMine, isWithMe: !isMine,\n      chips: filters.map(([id, label, fn]) => {\n        const on = fdef[0] === id;\n        return { label, count: String(live.filter(fn).length), on,\n          bg: on ? 'var(--text)' : 'var(--surface)', fg: on ? 'var(--bg)' : 'var(--text)', border: on ? 'var(--text)' : 'var(--border)',\n          countFg: on ? 'var(--faint)' : 'var(--muted)', pick: () => this.setState({ filter: id }) };\n      }),\n      countLabel: isMine ? shown.length + ' ' + pl(shown.length, 'udostępnienie', 'udostępnienia', 'udostępnień') : withMeAll.length + ' ' + pl(withMeAll.length, 'plik', 'pliki', 'plików') + ' od innych osób',\n      sections,\n      noShares: isMine && shown.length === 0,\n      withMe: withMeAll.map((x) => row(x, false)),\n      menuOpen: !!mx,\n      menuMain: s.menuView !== 'extend',\n      menuExtend: s.menuView === 'extend',\n      menu: mx ? {\n        name: mx.name, ext: mx.ext, badgeBg: badge[mx.kind][0], badgeFg: badge[mx.kind][1],\n        info: mMine ? mx.modeLabel : 'Od: ' + mx.owner + ' · ' + mx.perm,\n        mine: mMine, theirs: !mMine, isLink: mMine && mx.mode === 'link',\n        canExtend: mMine && md != null, exp: expLabel(md), expFg: (md != null && md \u003c= 7) ? 'var(--warn)' : 'var(--muted)',\n        canDownload: !mMine && mx.canDownload, viewOnly: !mMine && !mx.canDownload\n      } : { name: '', ext: '', badgeBg: 'transparent', badgeFg: 'transparent', info: '', mine: false, theirs: false, isLink: false, canExtend: false, exp: '', expFg: '', canDownload: false, viewOnly: false },\n      closeMenu: () => this.setState({ menuFor: null, menuView: 'main' }),\n      showExtend: () => this.setState({ menuView: 'extend' }),\n      hideExtend: () => this.setState({ menuView: 'main' }),\n      extOptions: [['O 7 dni', 7], ['O 30 dni', 30], ['Bez limitu', null]].map(([label, add]) => {\n        const nd = add == null || md == null ? null : md + add;\n        return { label, result: expLabel(nd).replace('Za s.fmt + '.zip' : base + '.' + s.fmt;\n    const sizes = { pdf: '2,4 MB', txt: '~18 KB', png: multi ? '~7,2 MB' : '~1,2 MB', jpg: multi ? '~2,6 MB' : '~430 KB' };\n    const notes = {\n      txt: 'Formatowanie, tabele i obrazy zostaną pominięte.',\n      png: multi ? 'Dokument ma 6 stron – obrazy zostaną spakowane do jednego pliku ZIP.' : 'Zostanie zapisana tylko pierwsza strona.',\n      jpg: multi ? 'Dokument ma 6 stron – obrazy zostaną spakowane do jednego pliku ZIP.' : 'Zostanie zapisana tylko pierwsza strona.'\n    };\n    const seg = (cur, val) => ({ bg: cur === val ? 'var(--seg)' : 'transparent', fg: cur === val ? 'var(--text)' : 'var(--muted)', on: cur === val });\n    const working = s.stage === 'convert' || s.stage === 'download';\n    return {\n      accent,\n      themeClass: (((this.props.theme && this.props.theme !== 'auto') ? this.props.theme : ((this.state && this.state.theme) || this.__t || 'dark')) === 'light' ? 't-light' : 't-dark'),\n      formats: formats.map((f) => {\n        const on = s.fmt === f.id;\n        return {\n          ext: f.ext, label: f.label, hint: f.hint, original: f.original, on,\n          bg: on ? 'var(--row-sel)' : 'transparent',\n          ring: on ? accent : 'var(--dash)',\n          dot: on ? accent : 'transparent',\n          pick: () => this.setState(Object.assign({ fmt: f.id }, reset))\n        };\n      }),\n      isImage,\n      pages: [['all', 'Wszystkie (6)'], ['first', 'Tylko pierwsza']].map(([id, label]) => Object.assign({ label, pick: () => this.setState(Object.assign({ pages: id }, reset)) }, seg(s.pages, id))),\n      versions: [3, 2, 1].map((v) => Object.assign({ label: v === 3 ? 'v3 · aktualna' : 'v' + v, pick: () => this.setState(Object.assign({ ver: v }, reset)) }, seg(s.ver, v))),\n      hasNote: !!notes[s.fmt],\n      note: notes[s.fmt] || '',\n      outName,\n      outSize: sizes[s.fmt],\n      isWorking: working,\n      isDone: s.stage === 'done',\n      workLabel: s.stage === 'convert' ? 'Konwertowanie do ' + s.fmt.toUpperCase() + '…' : 'Pobieranie…',\n      progress: s.p + '%',\n      btnBg: working ? 'var(--line)' : accent,\n      btnFg: working ? 'var(--placeholder)' : '#0B0B0C',\n      btnLabel: s.fmt === 'pdf' ? 'Pobierz oryginał' : 'Konwertuj i pobierz',\n      start: () => {\n        if (working) return;\n        clearInterval(this.timer);\n        const needsConvert = s.fmt !== 'pdf';\n        this.setState({ stage: needsConvert ? 'convert' : 'download', p: 0 });\n        this.timer = setInterval(() => {\n          const st = this.state;\n          if (st.p \u003c 100) { this.setState({ p: Math.min(100, st.p + 10) }); return; }\n          if (st.stage === 'convert') { this.setState({ stage: 'download', p: 0 }); return; }\n          clearInterval(this.timer);\n          this.setState({ stage: 'done' });\n        }, 120);\n      }\n    };\n  }\n}\n\u003c/script>\n\n\n\u003c/body>\u003c/html>", "Dodaj": "\u003c!DOCTYPE html>\n\u003chtml lang=\"pl\">\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Repozytorium – dodawanie plików\u003c/title>\n\u003cscript src=\"fc6a4292-bf8b-48ae-8ba2-1b27308225da\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"608d655f-ac7e-44ed-877f-a3002d93e6f8\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2df5a488-4d2e-4c79-a4f3-7914ec534bc3\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"76bc42b3-0ecd-475b-b61d-c6a92425779a\") format('woff2');\n  unic "M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/button>\n\u003c/sc-if>\n\u003csc-if value=\"{{isLast}}\" hint-placeholder-val=\"{{ false }}\">\n\u003ca href=\"Przesylanie.dc.html\" style=\"height: 52px; border-radius: 14px; background: {{accent}}; color: #0B0B0C; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px\">{{submitLabel}}\u003c/a>\n\u003c/sc-if>\n\u003c/div>\n\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;auto&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5B8CFF&quot;,&quot;options&quot;:[&quot;#5B8CFF&quot;,&quot;#3DDC97&quot;,&quot;#F2A65A&quot;,&quot;#EDEDEF&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.__t = (() => { try { const v = localStorage.getItem('repo-theme'); return v === 'auto' ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark') : v; } catch (e) { return null; } })();\n    this.state = { cur: 0, meta: {}, tagQuery: '' };\n  }\n  renderVals() {\n    const accent = this.props.accent ?? '#5B8CFF';\n    const s = this.state;\n    const files = [\n      { name: 'Umowa_najmu_2026.pdf', ext: 'PDF', kind: 'pdf', size: '2,4 MB', from: '', cat: 'Umowy', tags: [], suggest: ['#najem', '#2026', '#biuro'] },\n      { name: 'Faktura_10_2026.pdf', ext: 'PDF', kind: 'pdf', size: '284 KB', from: '', cat: '', tags: [], suggest: ['#faktura', '#2026', '#media'] },\n      { name: 'Zdjecie_wejscia.jpg', ext: 'JPG', kind: 'img', size: '3,6 MB', from: '', cat: '', tags: [], suggest: ['#budowa', '#wejście'] },\n      { name: 'Rzut_parteru.png', ext: 'PNG', kind: 'img', si   '5.1.3':'Filtrowanie i sortowanie zasobów',
  '5.1.4':'Zarządzanie kategoriami i tagami',
  '5.1.5':'Zarządzanie zasobami',
  '5.1.6':'Udostępnianie i zarządzanie udostępnieniami',
  '5.1.7':'Kontrola wersji i wykrywanie duplikatów',
  '5.1.8':'Pobieranie z opcjonalną konwersją formatu',
  '5.1.9':'Generowanie miniaturek zasobów',
  '5.1.10':'Autoryzacja i uwierzytelnianie użytkowników'
};
const SCREENS = [
  { id:'Logowanie', title:'Logowanie', req:['5.1.10'],
    desc:'Wejście do systemu e-mailem i hasłem albo jednym kliknięciem przez konto Google (SSO). Pola są sprawdzane na bieżąco.',
    tips:['Wpisz niepoprawny e-mail, aby zobaczyć walidację.','Przycisk Konto Google pokazuje logowanie jednokrotne.','Link „Zarejestruj się” prowadzi do tworzenia konta.'] },
  { id:'Rejestracja', title:'Rejestracja', req:['5.1.10'],
    desc:'Tworzenie nowego konta e-mailem lub przez Google. Wymagania dotyczące hasła są odhaczane w trakcie wpisywania.',
    tips:['Wpisuj hasło i obserwuj listę wymagań.','Różne hasła w obu polach dają komunikat o błędzie.','Bez akceptacji regulaminu konta nie da się utworzyć.'] },
  { id:'Main', title:'Przeglądanie repozytorium', req:['5.1.9','5.1.3','5.1.5'],
    desc:'Ekran główny z plikami pogrupowanymi według kategorii. Każdy typ pliku ma własną miniaturę: obraz, pierwszą stronę PDF lub podgląd tekstu.',
    tips:['Przełącz widok siatki i listy oraz zmień sortowanie.','Kliknij chip kategorii, aby zawęzić listę.','Przytrzymaj kartę, aby zaznaczyć kilka plików i usunąć je naraz.','Menu ⋮ na karcie prowadzi do udostępniania, pobierania i edycji.'] },
  { id:'Dodaj', title:'Dodawanie plików', req:['5.1.1','5.1.7'],
    desc:'Wybór pojedynczych plików lub archiwum ZIP. Archiwum jest rozpakowywane, nieobsługiwane pliki są odrzucane, a duplikaty wykrywane po zawartości.',
    tips:['Pokaż strukturę archiwum ZIP z plikami odrzuconymi.','Zwróć uwagę na ostrzeżenie o wykrytym duplikacie.','Przejdź dalej do kategoryzacji.'] },
  { id:'Kategoryzacja', title:'Kategoryzacja plików', req:['5.1.1','5.1.4'],
    desc:'Dla każdego dodawanego pliku można nadać tytuł, opis, kategorię i tagi. Nowy tag tworzy się od razu w tym miejscu.',
    tips:['Przechodź między plikami przyciskiem „Następny plik”.','Dodaj nowy tag lub wybierz jeden z sugerowanych.'] },
  { id:'Przesylanie', title:'Przesyłanie i podsumowanie', req:['5.1.1','5.1.7'],
    desc:'Postęp przesyłania oraz podsumowanie: ile dokumentów dodano, który duplikat zapisano osobno i co odrzucono z archiwum.',
    tips:['Pokaż podział na nowe pliki, duplikat i odrzucone.','Przesyłanie może trwać w tle po zamknięciu ekranu.'] },
  { id:'Szukaj', title:'Wyszukiwanie', req:['5.1.2'],
    desc:'Wyszukiwanie semantyczne w języku naturalnym albo dokładne dopasowanie frazy w nazwie, opisie i treści dokumentów.',
    tips:['Przełącz styl wyszukiwania między semantycznym a dokładnym.','Zawęź zakres do nazwy, opisu lub treści.','„Szukaj podobnych” otwiera porównanie dokumentów.'] },
  { id:'WyborDokumentu', title:'Wybór dokumentu do porównania', req:['5.1.2'],
    desc:'Wybór pliku, do którego system dopasuje dokumenty o podobnej treści.',
    tips:['Przefiltruj listę po nazwie.','Wybierz plik i kliknij „Znajdź podobne”.'] },
  { id:'Podobne', title:'Podobne dokumenty', req:['5.1.2'],
    desc:'Wyniki porównania treści uszeregowane od najbardziej zbliżonych, z procentem podobieństwa i wspólnymi tagami.',
    tips:['Omów miarę podobieństwa przy każdym wyniku.','Zmień porównywany plik przyciskiem „Zmień”.'] },
  { id:'Filtry', title:'Filtry i sortowanie', req:['5.1.3'],
    desc:'Zawężanie listy według typu pliku, kategorii, tagów i zakresu daty dodania oraz wybór kolejności sortowania.',
    tips:['Zaznacz kilka filtrów i sprawdź licznik wyników.','Wyszukaj tag w polu tekstowym.','„Wyczyść” resetuje wszystkie kryteria.'] },
  { id:'Kategorie', title:'Kategorie i tagi', req:['5.1.4'],
    desc:'Dedykowany widok do dodawania, zmiany nazwy i usuwania kategorii oraz tagów.',
    tips:['Dodaj nową kategorię lub tag.','Zmień nazwę istniejącej pozycji.','Usuń pozycję i zobacz ostrzeżenie o przypisanych plikach.'] },
  { id:'Dokument', title:'Szczegóły dokumentu i wersje', req:['5.1.5','5.1.7'],
    desc:'Metadane dokumentu i pełna historia wersji. Wcześniejszą wersję można przywrócić albo wskazać jako obowiązującą.',
    tips:['Otwórz zakładkę wersji.','Porównaj działanie „Przywróć” i „Ustaw aktualną”.','„Usuń” pokazuje potwierdzenie z liczbą wersji.'] },
  { id:'Edycja', title:'Edycja metadanych', req:['5.1.5','5.1.4'],
    desc:'Zmiana nazwy, opisu, kategorii i tagów dokumentu. Rozszerzenie pliku pozostaje zablokowane.',
    tips:['Zmień kategorię i dodaj tag.','Utwórz nowy tag bezpośrednio z pola tagów.'] },
  { id:'Udostepnij', title:'Udostępnij dokument', req:['5.1.6'],
    desc:'Generowanie linku dostępowego z uprawnieniami, terminem ważności i opcjonalnym hasłem oraz zapraszanie konkretnych osób.',
    tips:['Zmień uprawnienia i ważność linku.','Włącz ochronę hasłem.','„Wycofaj cały dostęp” natychmiast unieważnia link.'] },
  { id:'Udostepnione', title:'Zarządzanie udostępnieniami', req:['5.1.6'],
    desc:'Lista aktywnych udostępnień z możliwością zmiany ustawień, przedłużenia ważności i wycofania dostępu.',
    tips:['Otwórz menu udostępnienia i przedłuż ważność.','Wycofaj dostęp, a potem użyj „Cofnij”.'] },
  { id:'Gosc', title:'Widok gościa', req:['5.1.6'],
    desc:'To widzi osoba, która otrzymała link, także bez konta w systemie. Wygląd zależy od stanu linku.',
    tips:['Przełącz poniżej stan linku: aktywny, chroniony hasłem, wygasły.','W stanie hasła wpisz dowolne hasło, aby zobaczyć błąd.'], link:true },
  { id:'Pobierz', title:'Pobieranie z konwersją', req:['5.1.8'],
    desc:'Pobranie oryginału albo pliku przekonwertowanego do innego formatu, z wyborem stron i wersji dokumentu.',
    tips:['Wybierz inny format niż oryginał.','Uruchom pobieranie i pokaż postęp konwersji.'] },
  { id:'Ustawienia', title:'Ustawienia', req:[],
    desc:'Profil użytkownika, motyw oraz sposób wyświetlania nazw i dat. Zmiany od razu wpływają na pozostałe ekrany.',
    tips:['Zmień motyw na jasny i wróć do plików.','Przełącz nazwę w aplikacji na oryginalną nazwę pliku.','„Wyloguj się” wraca do ekranu logowania.'] }
];
const INDEX = Object.fromEntries(SCREENS.map((s,i)=>[s.id,i]));
const shell = JSON.parse(document.getElementById('demo-shell').textContent);
const manifestText = document.getElementById('demo-manifest').textContent.trim();
const extText = document.getElementById('demo-ext').textContent.trim();
const templates = JSON.parse(document.getElementById('demo-templates').textContent);
const LINK_STATES = [['aktywny','Aktywny'],['hasło','Z hasłem'],['wygasły','Wygasły']];

let store = { 'repo-theme':'dark' };
let linkState = 'aktywny';
let current = -1;
let seq = 0;
let frames = [];

const $ = (id)=>document.getElementById(id);
const esc = (o)=>JSON.stringify(o).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');

function shim(n){
  return '<script>(function(){var SEQ='+n+',store='+esc(store)+';'+
  'function post(m){m.__demo=1;m.seq=SEQ;try{parent.postMessage(m,"*")}catch(e){}}'+
  'var own=function(k){return Object.prototype.hasOwnProperty.call(store,k)};'+
  'var ls={getItem:function(k){k=String(k);return own(k)?store[k]:null},setItem:function(k,v){k=String(k);v=String(v);store[k]=v;post({t:"set",k:k,v:v})},removeItem:function(k){k=String(k);delete store[k];post({t:"del",k:k})},clear:function(){store={}},key:function(i){return Object.keys(store)[i]||null},get length(){return Object.keys(store).length}};'+
  'try{Object.defineProperty(window,"localStorage",{configurable:true,enumerable:true,get:function(){return ls}})}catch(e){}'+
  'window.addEventListener("click",function(e){if(e.defaultPrevented)return;var el=e.target;if(el&&el.nodeType!==1)el=el.parentElement;var a=el&&el.closest?el.closest("a[href]"):null;if(!a)return;var h=a.getAttribute("href")||"";var m=h.match(/([A-Za-z]+)\\.dc\\.html/);if(m){e.preventDefault();post({t:"nav",to:m[1]})}else if(h.charAt(0)!=="#"){e.preventDefault()}},false);'+
  'window.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;var t=e.target,g=t&&t.tagName;if(g==="INPUT"||g==="TEXTAREA"||g==="SELECT"||(t&&t.isContentEditable))return;if(["ArrowLeft","ArrowRight","h","H","f","F","t","T"].indexOf(e.key)<0)return;e.preventDefault();post({t:"key",key:e.key})},true);'+
  'var c=0,iv=setInterval(function(){c++;if(document.querySelector(".t-dark,.t-light")){clearInterval(iv);setTimeout(function(){post({t:"ready"})},40)}else if(c>200){clearInterval(iv);post({t:"ready"})}},40);'+
  '})();<\/script>';
}

function pageHtml(id, n){
  let tpl = templates[id];
  if (id === 'Gosc') tpl = tpl.replace('linkState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;aktywny&quot;,&quot;hasło&quot;,&quot;wygasły&quot;],&quot;default&quot;:&quot;aktywny&quot;', 'linkState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;aktywny&quot;,&quot;hasło&quot;,&quot;wygasły&quot;],&quot;default&quot;:&quot;'+linkState+'&quot;');
  const head = shell.replace('<head>', '<head>'+shim(n));
  return head +
    '<script type="__bundler/manifest">'+manifestText+'<\/script>\n' +
    '<script type="__bundler/ext_resources">'+extText+'<\/script>\n' +
    '<script type="__bundler/page_order">[]<\/script>\n' +
    '<script type="__bundler/template">'+esc(tpl)+'<\/script>\n</body>\n</html>';
}

function mount(id){
  const n = ++seq;
  const url = URL.createObjectURL(new Blob([pageHtml(id,n)], {type:'text/html'}));
  const f = document.createElement('iframe');
  f.title = SCREENS[INDEX[id]].title;
  f.dataset.seq = n;
  f.dataset.url = url;
  f.src = url;
  $('screen').appendChild(f);
  frames.push(f);
  setTimeout(()=>reveal(n), 4000);
}

function reveal(n){
  const f = frames.find((x)=>+x.dataset.seq===n);
  if (!f || f.classList.contains('on')) return;
  if (n !== seq) return;
  f.classList.add('on');
  $('loading').hidden = true;
  setTimeout(()=>{
    frames = frames.filter((x)=>{
      if (x === f) return true;
      URL.revokeObjectURL(x.dataset.url);
      x.remove();
      return false;
    });
  }, 220);
}

function go(i, opts){
  if (i < 0 || i >= SCREENS.length) return;
  const reload = opts && opts.reload;
  if (i === current && !reload) return;
  current = i;
  const s = SCREENS[i];
  mount(s.id);
  renderNotes();
  try { history.replaceState(null, '', '#'+s.id); } catch (e) {}
}

function renderNotes(){
  const s = SCREENS[current];
  const req = $('req');
  req.className = 'req' + (s.req.length > 1 ? ' many' : '') + (s.req.length === 0 ? ' none' : '');
  req.textContent = s.req.length ? s.req.join(', ') : 'Ustawienia';
  $('reqName').textContent = s.req.length ? s.req.map((r)=>REQ[r]).join('; ') : 'Uzupełnienie: preferencje użytkownika i wygląd aplikacji';
  $('title').textContent = s.title;
  $('desc').textContent = s.desc;
  const tips = $('tips');
  tips.replaceChildren(...s.tips.map((t)=>{ const li=document.createElement('li'); li.textContent=t; return li; }));
  $('linkCtrl').hidden = !s.link;
  $('count').textContent = (current+1)+' z '+SCREENS.length;
  $('miniLabel').textContent = (current+1)+'. '+s.title;
  $('prev').disabled = current === 0;
  $('next').disabled = current === SCREENS.length-1;
  $('miniPrev').disabled = current === 0;
  $('miniNext').disabled = current === SCREENS.length-1;
  document.querySelectorAll('.step').forEach((b,i)=>{
    if (i === current) { b.setAttribute('aria-current','step'); b.scrollIntoView({block:'nearest'}); }
    else b.removeAttribute('aria-current');
  });
  renderSegs();
}

function renderSegs(){
  const th = store['repo-theme'] === 'light' ? 'light' : (store['repo-theme'] === 'auto' ? 'auto' : 'dark');
  const seg = (el, opts, val, pick)=>{
    el.replaceChildren(...opts.map(([v,l])=>{
      const b=document.createElement('button');
      b.type='button'; b.textContent=l;
      b.setAttribute('aria-pressed', String(v===val));
      b.addEventListener('click', ()=>pick(v));
      return b;
    }));
  };
  seg($('themeSeg'), [['dark','Ciemny'],['light','Jasny'],['auto','Systemowy']], th, setTheme);
  seg($('linkSeg'), LINK_STATES, linkState, (v)=>{ linkState=v; renderSegs(); go(current,{reload:true}); });
}

function setTheme(v){
  store['repo-theme'] = v;
  renderSegs();
  go(current,{reload:true});
}

function buildSteps(){
  $('steps').replaceChildren(...SCREENS.map((s,i)=>{
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.type='button'; b.className='step';
    b.innerHTML='<span class="n"></span><span class="t"></span><span class="r"></span>';
    b.querySelector('.n').textContent=String(i+1);
    b.querySelector('.t').textContent=s.title;
    b.querySelector('.r').textContent=s.req.length?s.req.join(', '):'Preferencje';
    b.addEventListener('click',()=>go(i));
    li.appendChild(b);
    return li;
  }));
}

function fit(){
  const st = $('stage');
  const w = st.clientWidth - 48, h = st.clientHeight - (document.body.classList.contains('clean') || window.innerWidth <= 780 ? 124 : 48);
  const k = Math.max(0.3, Math.min(1.15, w/414, h/868));
  $('phone').style.transform = 'scale('+k+')';
  $('phoneBox').style.width = (414*k)+'px';
  $('phoneBox').style.height = (868*k)+'px';
}

function key(k){
  if (k === 'ArrowRight') go(current+1);
  else if (k === 'ArrowLeft') go(current-1);
  else if (k === 'h' || k === 'H') { document.body.classList.toggle('clean'); fit(); }
  else if (k === 'f' || k === 'F') {
    if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{});
  }
  else if (k === 't' || k === 'T') setTheme(store['repo-theme'] === 'light' ? 'dark' : 'light');
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if (!d || d.__demo !== 1) return;
  if (!frames.some((f)=>f.contentWindow === e.source)) return;
  if (d.t === 'ready') reveal(d.seq);
  else if (d.seq !== seq) return;
  else if (d.t === 'nav') { if (d.to in INDEX) go(INDEX[d.to]); }
  else if (d.t === 'set') { store[d.k] = d.v; if (d.k === 'repo-theme') renderSegs(); }
  else if (d.t === 'del') { delete store[d.k]; }
  else if (d.t === 'key') key(d.key);
});

document.addEventListener('keydown', (e)=>{
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const g = e.target && e.target.tagName;
  if (g === 'INPUT' || g === 'TEXTAREA') return;
  if (['ArrowLeft','ArrowRight','h','H','f','F','t','T'].indexOf(e.key) < 0) return;
  e.preventDefault();
  key(e.key);
});

$('prev').addEventListener('click', ()=>go(current-1));
$('next').addEventListener('click', ()=>go(current+1));
$('miniPrev').addEventListener('click', ()=>go(current-1));
$('miniNext').addEventListener('click', ()=>go(current+1));
window.addEventListener('resize', fit);

buildSteps();
fit();
const start = decodeURIComponent((location.hash||'').slice(1));
go(start in INDEX ? INDEX[start] : 0);
})();
</script>
</body>
</html>
